# Template file for Model Armor Service Extension
# This template will have its environment variables substituted during setup.
name: model-armor-unified-ext
loadBalancingScheme: EXTERNAL_MANAGED
forwardingRules:
- https://www.googleapis.com/compute/v1/projects/${PROJECT_ID}/regions/${REGION}/forwardingRules/agentverse-forwarding-rule
extensionChains:
- name: "chain-model-armor-unified"
  matchCondition:
    celExpression: 'request.path.startsWith("/v1/") || request.path.startsWith("/api/")'
  extensions:
  - name: model-armor-interceptor
    service: modelarmor.${REGION}.rep.googleapis.com
    failOpen: true
    supportedEvents:
    - REQUEST_HEADERS
    - REQUEST_BODY
    - RESPONSE_BODY
    - REQUEST_TRAILERS
    - RESPONSE_TRAILERS
    timeout: 10s
    metadata:
      model_armor_settings: |
        [
          {
            "model": "${MODEL_PATH}",
            "model_response_template_id": "projects/${PROJECT_ID}/locations/${REGION}/templates/${ARMOR_TEMPLATE_ID}",
            "user_prompt_template_id": "projects/${PROJECT_ID}/locations/${REGION}/templates/${ARMOR_TEMPLATE_ID}"
          },
          {
            "model": "gemma4:e2b",
            "model_response_template_id": "projects/${PROJECT_ID}/locations/${REGION}/templates/${ARMOR_TEMPLATE_ID}",
            "user_prompt_template_id": "projects/${PROJECT_ID}/locations/${REGION}/templates/${ARMOR_TEMPLATE_ID}"
          }
        ]
